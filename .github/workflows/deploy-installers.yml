name: Deploy AgentDNA Installers

# Publishes try.sh and try.ps1 to each environment's deploy path:
#   dev:       a pull request merged into develop
#   test-prod: a pull request merged into main
# The installers are published as they are in the repository.
# Manual runs (Actions tab, Run workflow) publish the chosen environment from
# its branch: dev from develop, test-prod from main.
# See DEPLOY.md in this folder for the secrets and the server layout.
on:
  pull_request:
    types: [closed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to publish the installers for (dev publishes develop, test-prod publishes main)
        type: choice
        options: [dev, test-prod]
        required: true
        default: dev

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy installers
    runs-on: ubuntu-latest
    # A pull request closed without merging publishes nothing.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    # One publish per environment at a time (merged pull requests and manual
    # runs alike); a newer one waits instead of interrupting a running one.
    concurrency:
      group: deploy-installers-${{ inputs.environment || (github.event.pull_request.base.ref == 'main' && 'test-prod' || 'dev') }}
      cancel-in-progress: false

    steps:
      - name: Select environment
        id: select
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          PR_BRANCH: ${{ github.event.pull_request.base.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual run: the chosen environment, from the latest commit of its
            # branch (whatever branch the run was started from).
            environment="$INPUT_ENVIRONMENT"
            case "$environment" in
              dev)       branch=develop ;;
              test-prod) branch=main ;;
              *)
                echo "::error::Unknown environment '$environment'"
                exit 1
                ;;
            esac
            ref="$branch"
          else
            # Merged pull request: the environment of its base branch, from the
            # merge commit.
            branch="$PR_BRANCH"
            case "$branch" in
              develop) environment=dev ;;
              main)    environment=test-prod ;;
              *)
                echo "::error::Installers are published from develop (dev) or main (test-prod), not '$branch'"
                exit 1
                ;;
            esac
            ref="$MERGE_SHA"
          fi
          {
            echo "environment=$environment"
            echo "branch=$branch"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing installers for $environment (branch $branch, ref $ref)"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.select.outputs.ref }}
          fetch-depth: 1

      - name: Check installers
        run: sh -n try.sh

      - name: Install sshpass
        if: steps.select.outputs.environment == 'dev'
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      # Sets DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, SSH_CMD and SCP_CMD for the
      # next steps.
      # dev:       password login (sshpass)
      # test-prod: key login (password login is disabled on that VM)
      # Both connect only to the host key pinned in the environment's secret.
      - name: Configure SSH
        env:
          ENVIRONMENT: ${{ steps.select.outputs.environment }}
          DEV_HOST: ${{ secrets.VM_HOST }}
          DEV_USER: ${{ secrets.VM_USER }}
          DEV_PASSWORD: ${{ secrets.VM_PASSWORD }}
          DEV_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          DEV_DEPLOY_PATH: ${{ secrets.VM_DEPLOY_PATH_DEV }}
          TEST_PROD_HOST: ${{ secrets.VM_HOST_TEST_PROD }}
          TEST_PROD_USER: ${{ secrets.VM_USER_TEST_PROD }}
          TEST_PROD_SSH_KEY: ${{ secrets.VM_SSH_KEY_TEST_PROD }}
          TEST_PROD_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS_TEST_PROD }}
          TEST_PROD_DEPLOY_PATH: ${{ secrets.VM_DEPLOY_PATH_TEST_PROD }}
        run: |
          install -m 700 -d ~/.ssh
          # Chosen here rather than in an expression, so a missing secret fails
          # the run instead of falling back to the other environment's VM.
          case "$ENVIRONMENT" in
            dev)
              host="$DEV_HOST"; user="$DEV_USER"; known_hosts="$DEV_KNOWN_HOSTS"
              deploy_path="$DEV_DEPLOY_PATH"; credential="$DEV_PASSWORD"
              runner="sshpass -e"
              ssh_opts="-o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no"
              ;;
            test-prod)
              host="$TEST_PROD_HOST"; user="$TEST_PROD_USER"; known_hosts="$TEST_PROD_KNOWN_HOSTS"
              deploy_path="$TEST_PROD_DEPLOY_PATH"; credential="$TEST_PROD_SSH_KEY"
              (umask 077 && printf '%s\n' "$TEST_PROD_SSH_KEY" > ~/.ssh/deploy_key)
              runner=""
              ssh_opts="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o PreferredAuthentications=publickey -o PasswordAuthentication=no"
              ;;
          esac
          # Fail early instead of connecting with an empty host or credential.
          if [ -z "$host" ] || [ -z "$user" ] || [ -z "$known_hosts" ] || [ -z "$deploy_path" ] || [ -z "$credential" ]; then
            echo "::error::Deploy secrets for $ENVIRONMENT are missing; see .github/workflows/DEPLOY.md"
            exit 1
          fi
          # The VM's host key is pinned through a secret instead of trusting
          # whatever answers ssh-keyscan.
          printf '%s\n' "$known_hosts" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          {
            echo "DEPLOY_HOST=$host"
            echo "DEPLOY_USER=$user"
            echo "DEPLOY_PATH=$deploy_path"
            echo "SSH_CMD=$runner ssh $ssh_opts"
            echo "SCP_CMD=$runner scp $ssh_opts"
          } >> "$GITHUB_ENV"

      - name: Create target folder
        env:
          # dev only. Read by sshpass -e; never passed on the command line.
          SSHPASS: ${{ steps.select.outputs.environment == 'dev' && secrets.VM_PASSWORD || '' }}
        run: |
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      - name: Copy installers
        env:
          SSHPASS: ${{ steps.select.outputs.environment == 'dev' && secrets.VM_PASSWORD || '' }}
        run: |
          echo "Deploying ${{ steps.select.outputs.environment }} installers to $DEPLOY_PATH"
          $SCP_CMD try.sh try.ps1 "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          # try.sh is executable in the repository; the served files need not be.
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "chmod 644 '$DEPLOY_PATH/try.sh' '$DEPLOY_PATH/try.ps1'"

      - name: Summary
        run: |
          echo "Published ${{ steps.select.outputs.environment }} installers (branch ${{ steps.select.outputs.branch }}, commit ${{ steps.select.outputs.ref }})" >> "$GITHUB_STEP_SUMMARY"
