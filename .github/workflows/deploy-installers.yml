name: Deploy AgentDNA Installers

# Publishes try.sh and try.ps1 to each environment's deploy path:
#   dev:       a pull request merged into develop
#   test-prod: a pull request merged into main
# The installers are published as they are in the repository.
# Manual runs (Actions tab, Run workflow) publish the chosen environment from
# its branch: dev from develop, test-prod from main.
# See DEPLOY.md in this folder for the secrets and the server layout.
on:
  pull_request:
    types: [closed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to publish the installers for (dev publishes develop, test-prod publishes main)
        type: choice
        options: [dev, test-prod]
        required: true
        default: dev

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy installers
    runs-on: ubuntu-latest
    # A pull request closed without merging publishes nothing.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    # One publish per environment at a time (merged pull requests and manual
    # runs alike); a newer one waits instead of interrupting a running one.
    concurrency:
      group: deploy-installers-${{ inputs.environment || (github.event.pull_request.base.ref == 'main' && 'test-prod' || 'dev') }}
      cancel-in-progress: false

    steps:
      - name: Select environment
        id: select
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          PR_BRANCH: ${{ github.event.pull_request.base.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual run: the chosen environment, from the latest commit of its
            # branch (whatever branch the run was started from).
            environment="$INPUT_ENVIRONMENT"
            case "$environment" in
              dev)       branch=develop ;;
              test-prod) branch=main ;;
              *)
                echo "::error::Unknown environment '$environment'"
                exit 1
                ;;
            esac
            ref="$branch"
          else
            # Merged pull request: the environment of its base branch, from the
            # merge commit.
            branch="$PR_BRANCH"
            case "$branch" in
              develop) environment=dev ;;
              main)    environment=test-prod ;;
              *)
                echo "::error::Installers are published from develop (dev) or main (test-prod), not '$branch'"
                exit 1
                ;;
            esac
            ref="$MERGE_SHA"
          fi
          {
            echo "environment=$environment"
            echo "branch=$branch"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing installers for $environment (branch $branch, ref $ref)"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.select.outputs.ref }}
          fetch-depth: 1

      - name: Check installers
        run: sh -n try.sh

      # Only the dev VM logs in with a password; test-prod uses an SSH key.
      - name: Install sshpass
        if: steps.select.outputs.environment == 'dev'
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy installers
        env:
          ENVIRONMENT: ${{ steps.select.outputs.environment }}
          # dev VM: password login
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          VM_DEPLOY_PATH_DEV: ${{ secrets.VM_DEPLOY_PATH_DEV }}
          # test-prod VM: key login (password login is disabled there)
          VM_HOST_TEST_PROD: ${{ secrets.VM_HOST_TEST_PROD }}
          VM_USER_TEST_PROD: ${{ secrets.VM_USER_TEST_PROD }}
          VM_SSH_KEY_TEST_PROD: ${{ secrets.VM_SSH_KEY_TEST_PROD }}
          VM_DEPLOY_PATH_TEST_PROD: ${{ secrets.VM_DEPLOY_PATH_TEST_PROD }}
        run: |
          # The target is chosen here rather than in an expression, so a missing
          # secret fails the run instead of falling back to the other VM.
          ssh_key_file="$HOME/.ssh/deploy_key"
          case "$ENVIRONMENT" in
            dev)
              host="$VM_HOST"
              user="$VM_USER"
              deploy_path="$VM_DEPLOY_PATH_DEV"
              credential="$VM_PASSWORD"
              required="VM_HOST, VM_USER, VM_PASSWORD, VM_DEPLOY_PATH_DEV"
              # sshpass -e reads the password from SSHPASS.
              export SSHPASS="$VM_PASSWORD"
              runner=(sshpass -e)
              ssh_opts=(-o StrictHostKeyChecking=yes)
              ;;
            test-prod)
              host="$VM_HOST_TEST_PROD"
              user="$VM_USER_TEST_PROD"
              deploy_path="$VM_DEPLOY_PATH_TEST_PROD"
              credential="$VM_SSH_KEY_TEST_PROD"
              required="VM_HOST_TEST_PROD, VM_USER_TEST_PROD, VM_SSH_KEY_TEST_PROD, VM_DEPLOY_PATH_TEST_PROD"
              runner=()
              # BatchMode: fail instead of falling back to a password prompt.
              ssh_opts=(-o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -i "$ssh_key_file")
              ;;
          esac
          if [ -z "$host" ] || [ -z "$user" ] || [ -z "$deploy_path" ] || [ -z "$credential" ]; then
            echo "::error::Missing deploy secret for $ENVIRONMENT; it needs $required"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          if [ "$ENVIRONMENT" = "test-prod" ]; then
            printf '%s\n' "$VM_SSH_KEY_TEST_PROD" > "$ssh_key_file"
            chmod 600 "$ssh_key_file"
          fi

          # A folder per run, so dev and test-prod publishes do not collide.
          remote_tmp="/tmp/agentdna-installers-${ENVIRONMENT}-${GITHUB_RUN_ID}"

          echo "Deploying $ENVIRONMENT installers to $deploy_path"

          "${runner[@]}" ssh "${ssh_opts[@]}" \
            "${user}@${host}" \
            "mkdir -p '${remote_tmp}'"

          "${runner[@]}" scp "${ssh_opts[@]}" \
            try.sh \
            try.ps1 \
            "${user}@${host}:${remote_tmp}/"

          "${runner[@]}" ssh "${ssh_opts[@]}" \
            "${user}@${host}" \
            "sudo mkdir -p '${deploy_path}' && \
             sudo install -m 0644 '${remote_tmp}/try.sh' '${deploy_path}/try.sh' && \
             sudo install -m 0644 '${remote_tmp}/try.ps1' '${deploy_path}/try.ps1' && \
             rm -rf '${remote_tmp}'"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Summary
        run: |
          echo "Published ${{ steps.select.outputs.environment }} installers (branch ${{ steps.select.outputs.branch }}, commit ${{ steps.select.outputs.ref }})" >> "$GITHUB_STEP_SUMMARY"
